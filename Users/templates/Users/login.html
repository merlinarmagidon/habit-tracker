{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    /* Свой фон только для страницы входа */
    html body {
        background: url('{% static "images/login_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: 100% 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Убираем возможные градиенты и наложения */
    html body::before,
    html body::after {
        display: none !important;
        content: none !important;
    }

    /* Оставляем контент видимым */
    .content {
        display: block !important;
    }

    /* Контейнер для поля ввода и ошибки */
    .input-wrapper {
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    /* Поле ввода */
    .input-wrapper input,
    .input-wrapper select,
    .input-wrapper textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #D6BDA8;
        border-radius: 10px;
        font-size: 16px;
        background-color: rgba(38, 44, 60, 0.9);
        color: #F3F4F5;
        box-sizing: border-box;
    }

    /* Контейнер для ошибки - ПОД полем */
    .error-container {
        min-height: 25px;
        margin-top: 5px;
        margin-bottom: 0;
        width: 100%;
    }

    .text-danger {
        color: #ff6b6b !important;
        font-size: 13px;
        display: block;
        text-align: left;
    }

    /* Стили для единого сообщения об ошибке */
    .alert-error {
        background-color: rgba(231, 76, 60, 0.9);
        color: white;
        padding: 12px 18px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: 2px solid #c0392b;
        font-weight: bold;
        font-size: 16px;
        text-align: center;
    }

    /* Исправляем выравнивание */
    .col-sm-3 {
        width: 25%;
        float: left;
        padding-left: 15px;
        padding-right: 15px;
        box-sizing: border-box;
    }

    .col-sm-8 {
        width: 66.666%;
        float: left;
        padding-left: 15px;
        padding-right: 15px;
        box-sizing: border-box;
    }

    .col-sm-6 {
        width: 50%;
        float: left;
        padding-left: 15px;
        padding-right: 15px;
        box-sizing: border-box;
    }

    .row:after {
        content: "";
        display: table;
        clear: both;
    }

    .text-right {
        text-align: right;
        padding-right: 15px;
    }

    .offset-sm-3 {
        margin-left: 25%;
    }

    /* Кнопка */
    .btn-block {
        width: 100%;
        margin-top: 10px;
    }
</style>
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card add-habit-card">
                <h2 class="card-header text-center">Вход</h2>
                <div class="card-body">

                    <!-- Единая плашка с ошибкой из контекста -->
                    {% if error %}
                        <div class="alert-error">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="form-group row">
                            <label for="username" class="col-sm-3 col-form-label text-right">Имя пользователя</label>
                            <div class="col-sm-8">
                                <div class="input-wrapper">
                                    <input type="text" name="username" id="username" class="form-control" required>
                                    <div class="error-container"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="password" class="col-sm-3 col-form-label text-right">Пароль</label>
                            <div class="col-sm-8">
                                <div class="input-wrapper">
                                    <input type="password" name="password" id="password" class="form-control" required>
                                    <div class="error-container"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6 offset-sm-3">
                            <button type="submit" class="btn btn-primary btn-block">Войти</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="mt-3">Нет учётной записи? <a href="{% url 'register' %}">Зарегистрируйтесь здесь</a>.</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
