{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    html body {
        background: url('{% static "images/login_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: 100% 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    html body::before, html body::after { display: none !important; content: none !important; }

    .content { display: block !important; padding-top: 120px !important; }

    .input-wrapper { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -ms-flex-direction: column; flex-direction: column; width: 100%; }
    .input-wrapper input { width: 100%; padding: 12px; border: 2px solid #D6BDA8; border-radius: 10px; font-size: 16px; background-color: rgba(38,44,60,0.9); color: #F3F4F5; -webkit-box-sizing: border-box; box-sizing: border-box; }

    .error-container { min-height: 25px; margin-top: 5px; margin-bottom: 0; width: 100%; }
    .text-danger { color: #ff6b6b !important; font-size: 13px; display: block; text-align: left; }

    .alert-error { background-color: rgba(231,76,60,0.9); color: white; padding: 12px 18px; margin-bottom: 20px; border-radius: 10px; border: 2px solid #c0392b; font-weight: bold; font-size: 16px; text-align: center; }

    .col-sm-3 { width: 25%; float: left; padding-left: 15px; padding-right: 15px; -webkit-box-sizing: border-box; box-sizing: border-box; }
    .col-sm-8 { width: 66.666%; float: left; padding-left: 15px; padding-right: 15px; -webkit-box-sizing: border-box; box-sizing: border-box; }
    .col-sm-6 { width: 50%; float: left; padding-left: 15px; padding-right: 15px; -webkit-box-sizing: border-box; box-sizing: border-box; }
    .row:after { content: ""; display: table; clear: both; }
    .text-right { text-align: right; padding-right: 15px; }
    .offset-sm-3 { margin-left: 25%; }

    .btn-block { width: 100%; margin-top: 10px; }
    .btn-primary { background-color: #D6BDA8 !important; color: #262C3C !important; border: 2px solid #262C3C !important; border-radius: 12px; padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer; -webkit-transition: all 0.3s ease; -o-transition: all 0.3s ease; transition: all 0.3s ease; }
    .btn-primary:hover { background-color: #262C3C !important; color: #D6BDA8 !important; border: 2px solid #D6BDA8 !important; -webkit-transform: translateY(-2px); -ms-transform: translateY(-2px); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(214,189,168,0.5); }

    .forgot-password { text-align: center; margin-top: 5px; margin-bottom: 15px; width: 100%; }
    .forgot-password a { color: #D6BDA8; text-decoration: none; font-size: 14px; }
    .forgot-password a:hover { color: #F3F4F5; text-decoration: underline; }

    .register-link { text-align: center; margin-top: 20px; width: 100%; }
    .register-link a { color: #D6BDA8; text-decoration: none; font-size: 14px; display: inline-block; }
    .register-link a:hover { color: #F3F4F5; text-decoration: underline; }

    @media (max-width: 768px) {
        .col-sm-3, .col-sm-8, .col-sm-6 { width: 100%; float: none; text-align: center; }
        .text-right { text-align: center; }
        .offset-sm-3 { margin-left: 0; }
        .btn-primary { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card add-habit-card">
            <h2 class="card-header text-center">Вход</h2>
            <div class="card-body">
                {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-group row">
                        <label for="username" class="col-sm-3 col-form-label text-right">Имя пользователя</label>
                        <div class="col-sm-8">
                            <div class="input-wrapper">
                                <input type="text" name="username" id="username" class="form-control" required>
                                <div class="error-container"></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="password" class="col-sm-3 col-form-label text-right">Пароль</label>
                        <div class="col-sm-8">
                            <div class="input-wrapper">
                                <input type="password" name="password" id="password" class="form-control" required>
                                <div class="error-container"></div>
                            </div>
                        </div>
                    </div>
                    <div class="forgot-password"><a href="{% url 'password_reset' %}">Забыли пароль?</a></div>
                    <div class="col-sm-6 offset-sm-3"><button type="submit" class="btn btn-primary btn-block">Войти</button></div>
                </form>
                <div class="register-link"><a href="{% url 'register' %}">Нет учётной записи? Зарегистрируйтесь здесь</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
