{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    .reset-card {
        background-color: rgba(38, 44, 60, 0.95);
        border: 3px solid #D6BDA8;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    
    .card-header {
        background-color: #262C3C;
        color: #D6BDA8;
        padding: 20px;
        border-radius: 15px 15px 0 0;
        font-weight: bold;
        font-size: 26px;
        border-bottom: 3px solid #D6BDA8;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        color: #D6BDA8;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 6px;
        display: block;
    }
    
    input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #D6BDA8;
        border-radius: 10px;
        font-size: 16px;
        background-color: rgba(38, 44, 60, 0.9);
        color: #F3F4F5;
    }
    
    .btn {
        background-color: #D6BDA8;
        color: #262C3C;
        border: 2px solid #262C3C;
        border-radius: 12px;
        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        width: 100%;
    }
    
    .btn:hover {
        background-color: #262C3C;
        color: #D6BDA8;
        border: 2px solid #D6BDA8;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(214, 189, 168, 0.5);
    }
    
    .text-center {
        text-align: center;
    }
    
    .mt-3 {
        margin-top: 15px;
    }
    
    .mt-4 {
        margin-top: 20px;
    }
    
    .mb-4 {
        margin-bottom: 20px;
    }
    
    a {
        color: #D6BDA8;
        text-decoration: none;
    }
    
    a:hover {
        color: #F3F4F5;
        text-decoration: underline;
    }
    
    .errorlist {
        color: #ff6b6b;
        list-style: none;
        margin-top: 5px;
        font-size: 14px;
    }
    
    .alert-danger {
        background-color: rgba(231, 76, 60, 0.9);
        color: white;
        padding: 12px 18px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: 2px solid #c0392b;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="reset-card">
            <h2 class="card-header text-center">Введите новый пароль</h2>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_new_password1">Новый пароль:</label>
                        <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="id_new_password2">Подтверждение пароля:</label>
                        <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert-danger">
                            {% for field in form %}
                                {% for error in field.errors %}
                                    <p>{{ error }}</p>
                                {% endfor %}
                            {% endfor %}
                        </div>
                    {% endif %}
                    <div class="text-center mt-4">
                        <button type="submit" class="btn">Изменить пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
