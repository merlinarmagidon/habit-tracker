{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    /* Свой фон только для гостевой страницы */
    html body {
        background: url('{% static "images/guest_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: 100% 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Убираем возможные градиенты и наложения */
    html body::before,
    html body::after {
        display: none !important;
        content: none !important;
    }

    /* Контент - поднимаем выше */
    .content {
        display: flex !important;
        justify-content: center;
        align-items: center;
        min-height: 50vh;
        padding: 20px !important;
        margin-top: 20px;
    }

    /* Контейнер с кнопкой */
    .guest-container {
        text-align: center;
        position: relative;
        z-index: 10;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Кнопка */
    .btn-try {
        background-color: #D6BDA8;
        color: #262C3C;
        border: 3px solid #262C3C;
        border-radius: 50px;
        padding: 12px 40px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        letter-spacing: 1px;
    }

    .btn-try:hover {
        background-color: #262C3C;
        color: #D6BDA8;
        border: 3px solid #D6BDA8;
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(214, 189, 168, 0.5);
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        .content {
            margin-top: 30px;
            min-height: 40vh;
        }

        .btn-try {
            padding: 10px 35px;
            font-size: 18px;
        }
    }

    @media (max-width: 480px) {
        .content {
            margin-top: 40px;
        }

        .btn-try {
            padding: 8px 30px;
            font-size: 16px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="guest-container">
    <a href="{% url 'register' %}" class="btn-try">Попробовать</a>
</div>
{% endblock %}
