{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    html body {
        background: url('{% static "images/guest_bg.jpg" %}') no-repeat center bottom fixed !important;
        background-size: auto !important;
        background-color: #F3F4F5 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    html body::before,
    html body::after {
        display: none !important;
        content: none !important;
    }

    /* Контент */
    .content {
        padding-top: 160px !important;
        position: relative;
        z-index: 6;
    }

    .guest-container {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -ms-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: center;
        -ms-flex-align: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .guest-title {
        font-size: 42px;
        color: #D6BDA8;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 30px;
        font-weight: bold;
    }

    .btn-try {
        background-color: #D6BDA8;
        color: #262C3C;
        border: 3px solid #262C3C;
        border-radius: 50px;
        padding: 14px 50px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        -webkit-transition: all 0.3s ease;
        -o-transition: all 0.3s ease;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-try:hover {
        background-color: #262C3C;
        color: #D6BDA8;
        border: 3px solid #D6BDA8;
        -webkit-transform: translateY(-3px);
        -ms-transform: translateY(-3px);
        transform: translateY(-3px);
    }

    @media (max-width: 1024px) {
        .content {
            padding-top: 140px !important;
        }
        .guest-title {
            font-size: 36px;
        }
        .btn-try {
            padding: 12px 45px;
            font-size: 20px;
        }
    }

    @media (max-width: 768px) {
        .content {
            padding-top: 130px !important;
        }
        .guest-title {
            font-size: 32px;
        }
        .btn-try {
            padding: 12px 40px;
            font-size: 20px;
        }
    }

    @media (max-width: 480px) {
        .content {
            padding-top: 120px !important;
        }
        .guest-title {
            font-size: 28px;
        }
        .btn-try {
            padding: 10px 30px;
            font-size: 18px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="guest-container">
    <h1 class="guest-title">Погружаясь в новый мир.</h1>
    <a href="{% url 'register' %}" class="btn-try">Попробовать</a>
</div>
{% endblock %}
