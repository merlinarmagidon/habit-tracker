{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    /* Используем дефолтный фон */
    html body {
        background: url('{% static "images/default_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: cover !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Убираем возможные градиенты и наложения */
    html body::before,
    html body::after {
        display: none !important;
        content: none !important;
    }

    /* Контент - адаптивные отступы */
    .content {
        display: block !important;
        min-height: 100vh;
        overflow-y: auto;
        padding: 180px 20px 40px !important;
    }

    /* Контейнер для изображения */
    .about-image-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 10px;
    }

    /* Изображение - адаптивное */
    .about-image {
        max-width: 100%;
        width: auto;
        height: auto;
        border: 3px solid #D6BDA8;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        object-fit: contain;
    }

    /* Для планшетов */
    @media (max-width: 1024px) {
        .content {
            padding: 160px 20px 40px !important;
        }
    }

    /* Для телефонов */
    @media (max-width: 768px) {
        .content {
            padding: 140px 15px 30px !important;
        }

        .about-image {
            width: 100%;
            border-width: 2px;
            border-radius: 15px;
        }
    }

    /* Для очень маленьких телефонов */
    @media (max-width: 480px) {
        .content {
            padding: 120px 10px 20px !important;
        }

        .about-image {
            border-width: 2px;
            border-radius: 12px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="about-image-container">
    <img src="{% static 'images/about_us.jpg' %}" alt="О нас" class="about-image">
</div>
{% endblock %}
