{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    /* Используем дефолтный фон */
    html body {
        background: url('{% static "images/default_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: cover !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Убираем возможные градиенты и наложения */
    html body::before,
    html body::after {
        display: none !important;
        content: none !important;
    }

    /* Контент - делаем видимым и добавляем прокрутку */
    .content {
        display: block !important;
        min-height: 100vh;
        overflow-y: auto;
        padding: 20px !important;
    }

    /* Контейнер для изображения */
    .about-image-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        width: 100%;
        padding: 20px;
    }

    /* Изображение */
    .about-image {
        max-width: 100%;
        width: auto;
        height: auto;
        max-height: none;
        border: 3px solid #D6BDA8;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        object-fit: contain;
    }
</style>
{% endblock %}

{% block content %}
<div class="about-image-container">
    <img src="{% static 'images/about_us.jpg' %}" alt="О нас" class="about-image">
</div>
{% endblock %}
