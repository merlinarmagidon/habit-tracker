{% extends "base.html" %}
{% load static %}

{% block page_styles %}
<style>
    html body {
        background: url('{% static "images/default_bg.jpg" %}') no-repeat center center fixed !important;
        background-size: cover !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .about-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }

    .about-image {
        max-width: 90%;
        width: auto;
        height: auto;
        border: none;
        box-shadow: none;
        border-radius: 0;
    }

    @media (max-width: 768px) {
        .about-image {
            max-width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="about-container">
    <img src="{% static 'images/about_us.jpg' %}" alt="О нас" class="about-image">
</div>
{% endblock %}
