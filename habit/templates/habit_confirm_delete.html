
{% extends "base.html" %}
{% load static %}

{% block content %}
    <h1>Подтверждение удаления</h1>
    <p>Вы уверены, что хотите удалить привычку "{{ habit.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="_method" value="delete">
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'active_habits' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
